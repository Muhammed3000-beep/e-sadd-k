<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>e-Saddık Cüzdan</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
background:#eef3f8;
font-family:"Segoe UI",Arial;

}


.header{

background:linear-gradient(135deg,#003b6f,#005ca8);
color:white;
padding:25px;
text-align:center;

}


.container{

width:95%;
max-width:700px;
margin:30px auto;

}


.card{

background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #0002;
margin-bottom:20px;

}


.balance{

text-align:center;
font-size:45px;
font-weight:bold;
color:#005ca8;

}


input,button{

width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;

}


input{

border:1px solid #ccc;

}


button{

background:#005ca8;
color:white;
border:0;

}


.history{

background:#f4f8fc;
padding:15px;
border-radius:10px;
margin-top:10px;

}


</style>

</head>


<body>


<div class="header">

<h1>💳 e-Saddık</h1>

<p>Dijital Cüzdan</p>

</div>



<div class="container">


<div class="card">


<h3>Bakiye</h3>


<div class="balance">

₺<span id="balance">0</span>

</div>


<p>

Vatandaş ID:

<b id="accountID">
---

</b>

</p>


</div>




<div class="card">


<h3>💸 Para Gönder</h3>


<input id="receiver"

placeholder="Alıcı ID">


<input id="amount"

type="number"

placeholder="Miktar">


<button onclick="sendMoney()">

Gönder

</button>


</div>




<div class="card">


<h3>📜 İşlem Geçmişi</h3>


<div id="history">

Yükleniyor...

</div>


</div>



</div>





<script type="module">


import {initializeApp}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getDatabase,
ref,
get,
update,
push,
set,
onValue

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig={

apiKey:"AIzaSyC9-0G-0-0-0",

authDomain:"esad-87546.firebaseapp.com",

databaseURL:"https://esad-87546-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"esad-87546",

storageBucket:"esad-87546.firebasestorage.app",

messagingSenderId:"7636719676",

appId:"1:7636719676:web:699f17f22759af64fa0b39"

};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);



let uid=null;

let myAccount=null;




onAuthStateChanged(auth,async(user)=>{


if(!user){

window.location.href="index.html";

return;

}



uid=user.uid;



let snap=

await get(

ref(db,"wallets/"+uid)

);



if(snap.exists()){


myAccount=snap.val();


document.getElementById("balance")
.innerHTML=
myAccount.balance || 0;


document.getElementById("accountID")
.innerHTML=
myAccount.accountId || "---";


loadHistory();


}


});







window.sendMoney=async function(){


let receiverID=

document.getElementById("receiver")
.value
.trim();



let amount=

Number(
document.getElementById("amount")
.value
);



if(!receiverID || !amount){

alert("Bilgileri doldur");

return;

}




let wallets=

(await get(ref(db,"wallets")))
.val();



let sender=

wallets[uid];



let receiverUID=null;



Object.keys(wallets)

.forEach(id=>{


if(
wallets[id].accountId==receiverID
){

receiverUID=id;

}


});



if(!receiverUID){

alert("Kullanıcı bulunamadı");

return;

}



if(sender.balance < amount){

alert("Yetersiz bakiye");

return;

}




await update(

ref(db,"wallets/"+uid),

{

balance:
sender.balance-amount

}

);



await update(

ref(db,"wallets/"+receiverUID),

{

balance:
wallets[receiverUID].balance+amount

}

);





let transaction=

push(
ref(db,"transactions")
);



await set(transaction,{

from:sender.accountId,

to:receiverID,

amount:amount,

date:new Date()
.toLocaleString("tr-TR")

});



alert("Transfer başarılı ✅");


location.reload();


}







function loadHistory(){



onValue(

ref(db,"transactions"),

(snapshot)=>{


let box=

document.getElementById("history");


box.innerHTML="";



snapshot.forEach(item=>{


let data=item.val();



if(

data.from==myAccount.accountId ||

data.to==myAccount.accountId

){


box.innerHTML+=


`

<div class="history">

💰 ${data.amount} TL

<br>

${data.from} → ${data.to}

<br>

📅 ${data.date}

</div>

`;


}


});


}

);


}



</script>


</body>

</html>

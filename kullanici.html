<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>e-Saddık Vatandaş Paneli</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}

body{
background:#eef3f8;
}

header{
background:#004b87;
color:#fff;
padding:25px;
text-align:center;
box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.container{
max-width:900px;
width:95%;
margin:30px auto;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.1);
margin-bottom:20px;
}

.card h2,
.card h3{
margin-bottom:15px;
color:#004b87;
}

input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
margin-top:10px;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
background:#004b87;
color:#fff;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#003766;
}

.document{
margin-top:15px;
padding:15px;
border-left:5px solid #004b87;
background:#f4f8fc;
border-radius:10px;
}

</style>

</head>

<body>

<header>

<h1>🏛️ e-Saddık</h1>

<p>Vatandaş Hizmet Paneli</p>

</header>

<div class="container">

<div class="card">

<h2 id="welcome">
Yükleniyor...
</h2>

<p>
Size özel gönderilen resmi evrakları görüntüleyebilirsiniz.
</p>

</div>

<div class="card">

<h3>🔎 İşlem Arayın</h3>

<input
id="search"
placeholder="İşlem Arayın">

<button
onclick="searchData()">

Ara

</button>

<div id="result"></div>

</div>

<div class="card">

<button onclick="logout()">

Güvenli Çıkış

</button>

</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getDatabase,
ref,
get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

apiKey:"AIzaSyC9-0gIJWNdp0WcsTbHcEhOku6NG2oFd2I",

authDomain:"esad-87546.firebaseapp.com",

databaseURL:"https://esad-87546-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"esad-87546",

storageBucket:"esad-87546.firebasestorage.app",

messagingSenderId:"7636719676",

appId:"1:7636719676:web:699f17f22759af64fa0b39"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);

let uid=null;

onAuthStateChanged(auth,async(user)=>{

if(!user){

window.location.href="index.html";
return;

}

uid=user.uid;

const snap=await get(ref(db,"users/"+uid));

if(snap.exists()){

const u=snap.val();

document.getElementById("welcome").innerHTML=
"Sayın "+u.name+" "+u.surname;

}

});
  window.searchData = async function(){

const value=document
.getElementById("search")
.value
.toLowerCase()
.trim();

const result=document.getElementById("result");

result.innerHTML="";

const snap=await get(
ref(db,"documents/"+uid)
);

if(!snap.exists()){

result.innerHTML=`
<div class="document">
❌ Hiç evrak bulunamadı.
</div>
`;

return;

}

let bulundu=false;

Object.values(snap.val()).forEach(item=>{

if(item.tag &&
item.tag.toLowerCase().includes(value)){

bulundu=true;

result.innerHTML+=`

<div class="document">

<h3>📄 ${item.tag}</h3>

<p>${item.message}</p>

<p><b>📅 Tarih:</b> ${item.date}</p>

</div>

`;

}

});

if(!bulundu){

result.innerHTML=`

<div class="document">

❌ İşlem bulunamadı.

</div>

`;

}

}



window.logout=function(){

signOut(auth).then(()=>{

window.location.href="index.html";

});

}

</script>

</body>

</html>

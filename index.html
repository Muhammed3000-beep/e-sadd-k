<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>e-Saddık | Dijital Hizmet Kapısı</title>

<style>

*{
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:#eef3f8;
}


.header{
    background:linear-gradient(135deg,#003b70,#0068b7);
    color:white;
    padding:35px 20px;
    text-align:center;
}


.header .logo{
    font-size:55px;
}


.header h1{
    margin:10px 0;
    font-size:32px;
}


.header p{
    margin:0;
    opacity:.9;
}



.container{

    width:95%;
    max-width:450px;
    margin:35px auto;

}



.card{

    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px #0002;

}



h2{

text-align:center;
color:#003b70;

}



input{

width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid #ccd6e0;
font-size:16px;

}



button{

width:100%;
padding:14px;
margin-top:18px;
border:0;
border-radius:10px;
background:#004f91;
color:white;
font-size:17px;
cursor:pointer;

}


button:hover{

background:#00345f;

}



.change{

text-align:center;
margin-top:20px;
color:#005ca8;
cursor:pointer;

}



.info{

margin-top:20px;
background:#f3f8ff;
border-left:4px solid #005ca8;
padding:12px;
font-size:14px;

}



@media(max-width:600px){

.header h1{
font-size:25px;
}


.card{
padding:22px;
}

}


</style>


</head>


<body>



<div class="header">

<div class="logo">
🏛️
</div>

<h1>e-Saddık</h1>

<p>Dijital Hizmet ve Vatandaşlık Sistemi</p>

</div>



<div class="container">


<div class="card">


<h2 id="title">
Vatandaş Girişi
</h2>



<div id="registerArea" style="display:none;">


<input id="name"
placeholder="Ad">


<input id="surname"
placeholder="Soyad">


</div>



<input id="email"
placeholder="E-Posta">


<input id="password"
type="password"
placeholder="Şifre">



<button onclick="process()"
id="mainButton">

Giriş Yap

</button>



<div class="change"
onclick="changeMode()"
id="changeText">

Yeni vatandaş kaydı oluştur

</div>



<div class="info">

🔒 Bilgileriniz Firebase güvenliği ile korunmaktadır.

</div>



</div>


</div>





<script type="module">


import {initializeApp}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getDatabase,
ref,
set,
get

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";




const firebaseConfig = {

apiKey:"AIzaSyC9-0gIJWNdp0WcsTbHcEhOku6NG2oFd2I",

authDomain:"esad-87546.firebaseapp.com",

databaseURL:"https://esad-87546-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"esad-87546",

storageBucket:"esad-87546.firebasestorage.app",

messagingSenderId:"7636719676",

appId:"1:7636719676:web:699f17f22759af64fa0b39"

};



const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getDatabase(app);



let registerMode=false;




window.changeMode=function(){


registerMode=!registerMode;


document.getElementById("registerArea")
.style.display =
registerMode ? "block":"none";


document.getElementById("title")
.innerHTML =
registerMode ?
"Vatandaş Kayıt":
"Vatandaş Girişi";


document.getElementById("mainButton")
.innerHTML =
registerMode ?
"Kayıt Ol":
"Giriş Yap";


document.getElementById("changeText")
.innerHTML =
registerMode ?
"Giriş ekranına dön":
"Yeni vatandaş kaydı oluştur";


}




window.process=async function(){



let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



try{


if(registerMode){



let name =
document.getElementById("name").value;


let surname =
document.getElementById("surname").value;



if(!name || !surname){

alert("Ad ve soyad zorunludur");
return;

}



const result =
await createUserWithEmailAndPassword(
auth,
email,
password
);



await set(

ref(db,"users/"+result.user.uid),

{

name:name,

surname:surname,

email:email,

role:"user",

createdAt:new Date().toLocaleString()

}

);



alert("Vatandaş kaydı başarıyla oluşturuldu");


location.href="kullanici.html";



}

else{


const result =
await signInWithEmailAndPassword(
auth,
email,
password
);



const profile =
await get(
ref(db,"users/"+result.user.uid)
);



if(profile.exists()){


location.href="kullanici.html";


}



}



}

catch(error){



if(error.code==="auth/email-already-in-use"){

alert("Bu e-posta zaten kayıtlı. Giriş yapmayı deneyin.");

}


else if(error.code==="auth/invalid-credential"){

alert("E-posta veya şifre hatalı.");

}


else if(error.code==="auth/weak-password"){

alert("Şifre en az 6 karakter olmalı.");

}


else{

alert(error.message);

}



}




}




</script>


</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>e-Saddık | Dijital Vatandaşlık Sistemi</title>

<style>

*{
box-sizing:border-box;
font-family:"Segoe UI",Arial;
}


body{

margin:0;
background:#edf2f7;

}


.header{

background:linear-gradient(135deg,#003b70,#0066b3);
color:white;
padding:25px;
text-align:center;

}


.header h1{

margin:0;
font-size:32px;

}


.header p{

margin:8px;

}



.container{

max-width:450px;
margin:35px auto;
padding:20px;

}



.card{

background:white;
padding:30px;
border-radius:18px;
box-shadow:0 8px 25px #0002;

}



.logo{

text-align:center;
font-size:50px;

}



input,button{

width:100%;
padding:14px;
margin-top:12px;
border-radius:8px;
font-size:16px;

}



input{

border:1px solid #ccc;

}


button{

background:#004f91;
color:white;
border:0;
cursor:pointer;

}



button:hover{

background:#00345f;

}



.switch{

text-align:center;
margin-top:15px;
color:#005ca8;
cursor:pointer;

}



.notice{

background:#f1f7ff;
padding:12px;
border-left:4px solid #005ca8;
margin-top:15px;

}



@media(max-width:600px){

.header h1{
font-size:24px;
}

.card{
padding:20px;
}

}


</style>


</head>


<body>


<div class="header">

<div class="logo">🏛️</div>

<h1>e-Saddık</h1>

<p>Dijital Vatandaşlık Hizmetleri</p>

</div>



<div class="container">


<div class="card">


<h2 id="title">
Vatandaş Girişi
</h2>


<div id="registerFields" style="display:none">


<input id="name" placeholder="Ad">

<input id="surname" placeholder="Soyad">


</div>



<input id="email" placeholder="E-Posta">


<input id="password"
type="password"
placeholder="Şifre">



<button onclick="action()"
id="btn">

Giriş Yap

</button>



<div class="switch"
onclick="changeMode()"
id="switch">

Kayıt olmak için tıklayın

</div>


<div class="notice">

e-Saddık sistemi güvenli dijital hizmet simülasyonudur.

</div>


</div>

</div>





<script type="module">


import {initializeApp}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getDatabase,
ref,
set,
get

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {

apiKey:"AIzaSyC9-0gIJWNdp0WcsTbHcEhOku6NG2oFd2I",

authDomain:"esad-87546.firebaseapp.com",

databaseURL:"https://esad-87546-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"esad-87546",

storageBucket:"esad-87546.firebasestorage.app",

messagingSenderId:"7636719676",

appId:"1:7636719676:web:699f17f22759af64fa0b39"

};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);



let register=false;




window.changeMode=function(){


register=!register;


document.getElementById("registerFields")
.style.display=
register?"block":"none";


document.getElementById("title")
.innerHTML=
register?
"Vatandaş Kayıt":
"Vatandaş Girişi";


document.getElementById("btn")
.innerHTML=
register?
"Kayıt Ol":
"Giriş Yap";


document.getElementById("switch")
.innerHTML=
register?
"Giriş yapmak için tıklayın":
"Kayıt olmak için tıklayın";


}





window.action=async function(){



let email=
document.getElementById("email").value;


let password=
document.getElementById("password").value;



try{



if(register){


let name=
document.getElementById("name").value;


let surname=
document.getElementById("surname").value;



if(!name||!surname){

alert("Ad soyad gerekli");
return;

}



const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);



await set(

ref(db,"users/"+result.user.uid),

{

name:name,

surname:surname,

email:email,

role:"user",

createdAt:new Date().toLocaleString()

}

);



alert("Vatandaş kaydı oluşturuldu");



}else{



const result=
await signInWithEmailAndPassword(
auth,
email,
password
);



const user=result.user;



const profile=
await get(
ref(db,"users/"+user.uid)
);



if(profile.exists()){


alert(

"Hoş geldiniz "+
profile.val().name+
" "+
profile.val().surname

);



location.href="panel.html";


}



}



}catch(error){



if(error.code==="auth/email-already-in-use"){

alert("Bu e-posta zaten kayıtlı. Lütfen giriş yapın.");

}

else if(error.code==="auth/weak-password"){

alert("Şifre en az 6 karakter olmalı.");

}

else if(error.code==="auth/invalid-credential"){

alert("E-posta veya şifre hatalı.");

}

else{

alert(error.message);

}


}



}



</script>


</body>
</html>

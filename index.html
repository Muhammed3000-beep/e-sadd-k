<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>e-Saddık Giriş</title>

<style>

body{

margin:0;
background:#eef3f8;
font-family:"Segoe UI",Arial;

}


.box{

max-width:420px;
width:90%;
background:white;
margin:50px auto;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px #0003;

}


h1{

text-align:center;
color:#004b87;

}


input,button{

width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;

}


input{

border:1px solid #ccc;

}


button{

background:#005ca8;
color:white;
border:0;
cursor:pointer;

}


button:hover{

background:#003b70;

}


#msg{

text-align:center;
margin-top:15px;

}


</style>

</head>


<body>



<div class="box">


<h1>🏛️ e-Saddık</h1>

<p style="text-align:center">
Vatandaş Sistemi
</p>



<h3>Kayıt Ol</h3>


<input id="name"
placeholder="Ad">


<input id="surname"
placeholder="Soyad">


<input id="email"
placeholder="E-Posta">


<input id="password"
type="password"
placeholder="Şifre">


<button onclick="register()">

Kayıt Ol

</button>




<hr>



<h3>Giriş Yap</h3>


<input id="loginEmail"
placeholder="E-Posta">


<input id="loginPassword"
type="password"
placeholder="Şifre">


<button onclick="login()">

Giriş Yap

</button>



<p id="msg"></p>


</div>






<script type="module">


import {initializeApp}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
setPersistence,
browserLocalPersistence

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

getDatabase,
ref,
set

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";




const firebaseConfig={


apiKey:"AIzaSyC9-0G-0-0-0",

authDomain:"esad-87546.firebaseapp.com",

databaseURL:"https://esad-87546-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"esad-87546",

storageBucket:"esad-87546.firebasestorage.app",

messagingSenderId:"7636719676",

appId:"1:7636719676:web:699f17f22759af64fa0b39"


};




const app=initializeApp(firebaseConfig);


const auth=getAuth(app);


const db=getDatabase(app);



setPersistence(
auth,
browserLocalPersistence
);





window.register=async()=>{


let name=
document.getElementById("name").value;


let surname=
document.getElementById("surname").value;


let email=
document.getElementById("email").value;


let password=
document.getElementById("password").value;



try{


let userCredential=

await createUserWithEmailAndPassword(

auth,
email,
password

);



let uid=userCredential.user.uid;



await set(

ref(db,"users/"+uid),

{

name:name,

surname:surname,

email:email

}

);



// cüzdan oluştur

await set(

ref(db,"wallets/"+uid),

{

name:name,

surname:surname,

accountId:
Math.floor(10000+Math.random()*90000),

balance:1000

}

);



document.getElementById("msg")
.innerHTML=
"✅ Kayıt başarılı";


window.location.href="kullanici.html";



}

catch(e){

document.getElementById("msg")
.innerHTML=e.message;

}


}





window.login=async()=>{


let email=

document.getElementById("loginEmail").value;


let password=

document.getElementById("loginPassword").value;



try{


await signInWithEmailAndPassword(

auth,
email,
password

);



window.location.href="kullanici.html";


}

catch(e){


document.getElementById("msg")
.innerHTML=e.message;


}



}



</script>


</body>

</html>
